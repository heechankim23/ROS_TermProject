name: 샛길 불법 주차·동쪽 연결로 우회
map: street_extended
gps_noise_sigma: 0.15
robot:
  initial_battery_pct: 95
  capacity: 4
scooters:
- id: 1
  x: 3
  y: 10.7
  yaw_deg: 0
  tilt_deg: 90
  battery_pct: 80
  weight_kg: 18
extended:
  weight_limit_kg: 75
  speed_limit: 0.5
  accel_limit: 0.4
params:
  mission_manager:
    max_dock_retries: 3
  nav_bridge:
    goal_timeout_sec: 600.0
  sim_tag_detector:
    camera_offset_x: 0.76
triggers:
- state: NAVIGATING
  id: 1
  event:
    type: obstacle
    name: illegal_car
    x: -0.5
    y: 8
    size:
    - 4.8
    - 2
    - 1.5
