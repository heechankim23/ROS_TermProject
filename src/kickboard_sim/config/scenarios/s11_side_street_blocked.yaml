name: "11. 샛길 입구가 막힘 (공사 펜스)"
map: street
description: >
  샛길의 간선도로 쪽 입구를 공사 펜스가 막고 있다. 샛길 북쪽 끝에 넘어진 1대, 뒷길 옆에 배터리 부족 1대.
  통과: 연결로 -> 뒷길로 돌아 샛길 북쪽에서 들어가 수거 (순환로) -> 주차구역·충전소 하역 -> 충전
  주의: 킥보드를 펜스 바로 뒤(3 m 이내)에 두면 로봇이 펜스 앞에서 목표를 계속 바꾸며 제자리에서 돈다 (알려진 한계)
# 도로 맵 배치 규칙: 킥보드는 연석에서 0.4 m 안쪽 인도에, 연석과 나란히 둔다.
# yaw 는 넘어질 때 기둥이 인도 안쪽으로 눕는 방향 (북쪽 인도 180, 남쪽 인도 0, 샛길 서쪽 -90, 동쪽 연석 90).
robot: {initial_battery_pct: 60, capacity: 4}
gps_noise_sigma: 0.5
scooters:
  - {id: 1, x: -3.4, y: 10.2, yaw_deg: -90, tilt_deg: 90, battery_pct: 75}
  - {id: 2, x: 7.0, y: 10.6, yaw_deg: 0, battery_pct: 9}
events:
  - {t: 0, type: obstacle, name: fence, x: -0.5, y: 5.6, size: [5.0, 0.8, 1.2]}
