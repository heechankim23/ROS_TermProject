name: "7. 장애물 회피"
map: street
description: >
  5초에 간선도로 위(가는 길)에 장애물(1.0 x 2.0 m, 정차 차량·적치물)이 생긴다.
  통과: 라이다에 잡혀 경로를 다시 계획, 차도 안에서 옆으로 돌아 접촉 없이 도착·수거
# 도로 맵 배치 규칙: 킥보드는 연석에서 0.4 m 안쪽 인도에, 연석과 나란히 둔다.
# yaw 는 넘어질 때 기둥이 인도 안쪽으로 눕는 방향 (북쪽 인도 180, 남쪽 인도 0, 샛길 서쪽 -90, 동쪽 연석 90).
robot: {initial_battery_pct: 100, capacity: 4}
scooters:
  - {id: 1, x: 5.0, y: 5.4, yaw_deg: 180}
events:
  - {t: 5, type: obstacle, name: obstacle_1, x: -2.0, y: 3.0, size: [1.0, 2.0, 1.0]}
