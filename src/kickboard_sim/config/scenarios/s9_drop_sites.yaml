name: "9. 하역 장소 (주차구역 / 충전소)"
map: street
description: >
  배터리 정상인 넘어짐·구역 밖 킥보드는 인도 주차구역에 세우고, 배터리 부족(넘어짐이어도)은 충전소에 하역.
  통과: 4대 적재 -> 주차구역 2대 -> 도킹 -> 충전소 하역 2대 -> 충전
# 도로 맵 배치 규칙: 킥보드는 연석에서 0.4 m 안쪽 인도에, 연석과 나란히 둔다.
# yaw 는 넘어질 때 기둥이 인도 안쪽으로 눕는 방향 (북쪽 인도 180, 남쪽 인도 0, 샛길 서쪽 -90, 동쪽 연석 90).
robot: {initial_battery_pct: 100, capacity: 4}
scooters:
  - {id: 1, x: -8.0, y: 5.4, yaw_deg: 180, tilt_deg: 90, battery_pct: 80}    # 넘어짐, 배터리 정상 -> 주차구역
  - {id: 2, x: 5.0, y: 5.4, yaw_deg: 180, battery_pct: 70}                   # 구역 밖, 배터리 정상 -> 주차구역
  - {id: 3, x: -3.4, y: 7.5, yaw_deg: -90, tilt_deg: 90, battery_pct: 10}    # 넘어짐 + 배터리 부족 -> 충전소
  - {id: 4, x: 10.5, y: -1.45, yaw_deg: 0, battery_pct: 8}                   # 구역 S1 안, 배터리 부족 -> 충전소
