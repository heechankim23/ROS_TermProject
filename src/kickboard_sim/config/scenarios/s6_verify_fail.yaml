name: "6. 확인 실패"
map: street
description: >
  1번은 요청만 오고 실물이 없음. 통과: 회전 탐색 10초 후 실패·관리자 알림, 다음 대상(2번) 수거
# 도로 맵 배치 규칙: 킥보드는 연석에서 0.4 m 안쪽 인도에, 연석과 나란히 둔다.
# yaw 는 넘어질 때 기둥이 인도 안쪽으로 눕는 방향 (북쪽 인도 180, 남쪽 인도 0, 샛길 서쪽 -90, 동쪽 연석 90).
robot: {initial_battery_pct: 100, capacity: 4}
scooters:
  - {id: 1, x: 5.0, y: 5.4, model: false}
  - {id: 2, x: -8.0, y: 5.4, yaw_deg: 180}
