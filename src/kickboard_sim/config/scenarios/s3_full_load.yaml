name: "3. 만재"
map: street
description: >
  적재함 4칸, 요청 5건. 통과: 4대 싣고 주차구역 하역 -> 남은 1대 이어서 처리 -> 충전
# 도로 맵 배치 규칙: 킥보드는 연석에서 0.4 m 안쪽 인도에, 연석과 나란히 둔다.
# yaw 는 넘어질 때 기둥이 인도 안쪽으로 눕는 방향 (북쪽 인도 180, 남쪽 인도 0, 샛길 서쪽 -90, 동쪽 연석 90).
robot: {initial_battery_pct: 100, capacity: 4}
scooters:
  - {id: 1, x: -8.0, y: 5.4, yaw_deg: 180}
  - {id: 2, x: -3.4, y: 7.5, yaw_deg: -90}
  - {id: 3, x: 5.0, y: 5.4, yaw_deg: 180}
  - {id: 4, x: 17.4, y: 8.0, yaw_deg: 90}
  - {id: 5, x: 0.0, y: -1.4, yaw_deg: 0}
