name: "8. 자동 취소"
map: street
description: >
  로봇이 먼 1번으로 가는 동안, 주차구역 N1 안의 2번이 3초에 넘어졌다가 15초에 누가 다시 세운다.
  통과: 2번이 대기열에서 자동 취소, 1번만 수거
# 도로 맵 배치 규칙: 킥보드는 연석에서 0.4 m 안쪽 인도에, 연석과 나란히 둔다.
# yaw 는 넘어질 때 기둥이 인도 안쪽으로 눕는 방향 (북쪽 인도 180, 남쪽 인도 0, 샛길 서쪽 -90, 동쪽 연석 90).
robot: {initial_battery_pct: 100, capacity: 4}
scooters:
  - {id: 1, x: 17.4, y: 8.0, yaw_deg: 90}           # 주차구역 밖, 먼 곳 -> 먼저 처리
  - {id: 2, x: -12.5, y: 5.45, yaw_deg: 180}        # 구역 N1 안
events:
  - {t: 3, id: 2, type: fall}
  - {t: 15, id: 2, type: stand}
