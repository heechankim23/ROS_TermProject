name: "14. 가는 도중 누가 빌려 감 (헛걸음)"
map: street
description: >
  로봇이 먼 1번으로 가는 중(약 1분)에 1번이 대여되어 사라진다. 처리 중인 항목은 비선점이라 취소되지 않는다.
  통과: 도착 -> 회전 탐색 10초 -> verify_failed + 관리자 알림 -> 그사이 넘어진 2번 수거
# 도로 맵 배치 규칙: 킥보드는 연석에서 0.4 m 안쪽 인도에, 연석과 나란히 둔다.
# yaw 는 넘어질 때 기둥이 인도 안쪽으로 눕는 방향 (북쪽 인도 180, 남쪽 인도 0, 샛길 서쪽 -90, 동쪽 연석 90).
robot: {initial_battery_pct: 100, capacity: 4}
scooters:
  - {id: 1, x: 17.4, y: 8.0, yaw_deg: 90}
  - {id: 2, x: -12.5, y: 5.45, yaw_deg: 180}        # 구역 N1 안에 서 있다가 20초에 넘어짐
events:
  - {t: 15, id: 1, type: rent}
  - {t: 20, id: 2, type: fall}
