name: "19. 피크 시간 (킥보드가 계속 반납됨)"
map: street
description: >
  15초마다 이용자가 킥보드를 타고 와 구역 밖에 두고 간다 (spawn_at = 그때 새로 나타남), 총 6대. 일부는 넘어짐·배터리 부족.
  처리 속도보다 접수가 빨라 대기열이 쌓인다. 통과: 6대 모두 수거. 측정: 최대·평균 대기 시간, 하역 왕복 횟수
# 도로 맵 배치 규칙: 킥보드는 연석에서 0.4 m 안쪽 인도에, 연석과 나란히 둔다.
# yaw 는 넘어질 때 기둥이 인도 안쪽으로 눕는 방향 (북쪽 인도 180, 남쪽 인도 0, 샛길 서쪽 -90, 동쪽 연석 90).
robot: {initial_battery_pct: 100, capacity: 4}
scooters:
  - {id: 1, x: 4.0, y: 5.4, yaw_deg: 180, spawn_at: 0}
  - {id: 2, x: -3.4, y: 9.0, yaw_deg: -90, tilt_deg: 90, spawn_at: 15}
  - {id: 3, x: 2.4, y: 8.0, yaw_deg: 90, battery_pct: 9, spawn_at: 30}
  - {id: 4, x: 8.0, y: 10.6, yaw_deg: 0, tilt_deg: 90, spawn_at: 45}
  - {id: 5, x: 15.0, y: -1.4, yaw_deg: 0, battery_pct: 7, spawn_at: 60}
  - {id: 6, x: -15.0, y: 5.4, yaw_deg: 180, spawn_at: 75}
