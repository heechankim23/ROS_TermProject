name: "16. 세워 둔 킥보드가 다시 넘어짐"
map: street
description: >
  수거해 주차구역에 세워 둔 1번이 220초에 (바람·행인에) 다시 넘어진다 -> 같은 ID 의 새 요청.
  통과: 1번 수거·하역 -> 다시 FALLEN 요청 -> 두 번째 수거·하역 (다른 빈 자리)
# 도로 맵 배치 규칙: 킥보드는 연석에서 0.4 m 안쪽 인도에, 연석과 나란히 둔다.
# yaw 는 넘어질 때 기둥이 인도 안쪽으로 눕는 방향 (북쪽 인도 180, 남쪽 인도 0, 샛길 서쪽 -90, 동쪽 연석 90).
robot: {initial_battery_pct: 100, capacity: 4}
gps_noise_sigma: 0.5
scooters:
  - {id: 1, x: -8.0, y: 5.4, yaw_deg: 180, tilt_deg: 90, battery_pct: 80}
events:
  - {t: 220, id: 1, type: fall}
