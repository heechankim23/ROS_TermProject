name: "15. 대기 중 누가 옮겨 놓음"
map: street
description: >
  2번이 대기 중일 때 누가 12 m 떨어진 곳으로 끌어다 놓는다(여전히 구역 밖). 펌웨어가 새 GPS 로 다시 요청 -> 병합·위치 갱신.
  통과: 2번 요청이 merged=True 로 한 번 더 접수되고, 로봇이 옛 자리가 아니라 새 자리에서 수거
# 도로 맵 배치 규칙: 킥보드는 연석에서 0.4 m 안쪽 인도에, 연석과 나란히 둔다.
# yaw 는 넘어질 때 기둥이 인도 안쪽으로 눕는 방향 (북쪽 인도 180, 남쪽 인도 0, 샛길 서쪽 -90, 동쪽 연석 90).
robot: {initial_battery_pct: 100, capacity: 4}
scooters:
  - {id: 1, x: -8.0, y: 5.4, yaw_deg: 180}
  - {id: 2, x: 17.4, y: 8.0, yaw_deg: 90}
events:
  - {t: 8, id: 2, type: move, x: 5.0, y: 5.4, yaw_deg: 180}
