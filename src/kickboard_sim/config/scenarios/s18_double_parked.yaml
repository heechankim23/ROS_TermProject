name: "18. 불법 주차 차량이 킥보드 앞을 막음"
map: street
description: >
  간선도로 가장자리에 불법 주차 차량(4.4 x 1.9 m)이 서 있고, 1번 킥보드는 바로 그 뒤 인도에 있다. 2번은 열린 곳.
  통과: 2번 수거. 1번은 차 때문에 로봇이 팔 닿는 자리에 설 수 없으면 align_failed/nav_failed + 관리자 알림
  (사람이 처리해야 하는 경우를 붙잡지 않고 넘기는지 확인). 차는 접촉 없이 피해 간다.
# 도로 맵 배치 규칙: 킥보드는 연석에서 0.4 m 안쪽 인도에, 연석과 나란히 둔다.
# yaw 는 넘어질 때 기둥이 인도 안쪽으로 눕는 방향 (북쪽 인도 180, 남쪽 인도 0, 샛길 서쪽 -90, 동쪽 연석 90).
robot: {initial_battery_pct: 100, capacity: 4}
scooters:
  - {id: 1, x: 5.0, y: 5.4, yaw_deg: 180}
  - {id: 2, x: 10.0, y: 5.4, yaw_deg: 180, tilt_deg: 90}
events:
  - {t: 0, type: obstacle, name: parked_car, x: 5.0, y: 3.9, size: [4.4, 1.9, 1.5]}
