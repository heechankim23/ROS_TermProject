name: "2. 이동 중 새 요청"
map: street
description: >
  요청 2건 처리 중 20초에 1건 추가 (남쪽 주차구역에 서 있던 3번이 넘어짐).
  통과: 가던 길을 끊지 않고 현재 대상을 끝낸 뒤 재평가, 3건 모두 수거 (비선점)
# 도로 맵 배치 규칙: 킥보드는 연석에서 0.4 m 안쪽 인도에, 연석과 나란히 둔다.
# yaw 는 넘어질 때 기둥이 인도 안쪽으로 눕는 방향 (북쪽 인도 180, 남쪽 인도 0, 샛길 서쪽 -90, 동쪽 연석 90).
robot: {initial_battery_pct: 100, capacity: 4}
scooters:
  - {id: 1, x: -8.0, y: 5.4, yaw_deg: 180}                       # 주차구역 밖
  - {id: 2, x: -12.5, y: 5.45, yaw_deg: 180, battery_pct: 10}    # 구역 N1 안, 배터리 부족
  - {id: 3, x: 10.5, y: -1.45, yaw_deg: 0}                       # 구역 S1 안, 20초에 넘어짐
events:
  - {t: 20, id: 3, type: fall}
