name: "1. 단일 수거"
map: street
description: >
  간선도로 북쪽 인도에 주차구역 밖으로 세워진 1대(OUT_OF_ZONE) -> 10초에 넘어져(FALLEN) 같은 ID 로 병합.
  통과: 병합(merged=True) -> 차도로 접근 -> 확인 -> 적재 -> 주차구역에 세움 -> 충전소 복귀·충전
# 도로 맵 배치 규칙: 킥보드는 연석에서 0.4 m 안쪽 인도에, 연석과 나란히 둔다.
# yaw 는 넘어질 때 기둥이 인도 안쪽으로 눕는 방향 (북쪽 인도 180, 남쪽 인도 0, 샛길 서쪽 -90, 동쪽 연석 90).
robot: {initial_battery_pct: 70, capacity: 4}
scooters:
  - {id: 1, x: -8.0, y: 5.4, yaw_deg: 180}
events:
  - {t: 10, id: 1, type: fall}
