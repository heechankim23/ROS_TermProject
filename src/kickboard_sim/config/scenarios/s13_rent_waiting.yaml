name: "13. 대기 중 누가 빌려 감 -> 반납"
map: street
description: >
  2번이 대기열에 있는 동안 누가 빌려 가서 보고가 끊긴다 -> 8초 뒤 자동 취소 (헛걸음 없음).
  70초에 남쪽 인도에 넘어진 채 반납 -> 새 요청으로 접수되어 수거.
  통과: 2번 CANCELLED -> 반납 뒤 2번 수거
# 도로 맵 배치 규칙: 킥보드는 연석에서 0.4 m 안쪽 인도에, 연석과 나란히 둔다.
# yaw 는 넘어질 때 기둥이 인도 안쪽으로 눕는 방향 (북쪽 인도 180, 남쪽 인도 0, 샛길 서쪽 -90, 동쪽 연석 90).
robot: {initial_battery_pct: 100, capacity: 4}
scooters:
  - {id: 1, x: -8.0, y: 5.4, yaw_deg: 180}          # 가까움 -> 먼저 처리
  - {id: 2, x: 17.4, y: 8.0, yaw_deg: 90}           # 멀리서 대기
events:
  - {t: 10, id: 2, type: rent}
  - {t: 70, id: 2, type: return, x: 5.0, y: -1.4, yaw_deg: 0, tilt_deg: 90, battery_pct: 55}
