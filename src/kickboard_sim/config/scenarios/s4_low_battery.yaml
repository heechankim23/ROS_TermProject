name: "4. 로봇 배터리 부족"
map: street
description: >
  로봇 배터리 22% 로 시작. 첫 대상까지 차도로 25 m 이상이라 가는 길에 20% 에 닿는다 (0.12 %/m).
  통과: 주행 중 20% -> 현재 대상을 대기열에 되돌리고(REQUEUE) 복귀 -> 80% 충전 -> 2건 모두 수거
# 도로 맵 배치 규칙: 킥보드는 연석에서 0.4 m 안쪽 인도에, 연석과 나란히 둔다.
# yaw 는 넘어질 때 기둥이 인도 안쪽으로 눕는 방향 (북쪽 인도 180, 남쪽 인도 0, 샛길 서쪽 -90, 동쪽 연석 90).
robot: {initial_battery_pct: 22, capacity: 4}
scooters:
  - {id: 1, x: 5.0, y: 5.4, yaw_deg: 180}
  - {id: 2, x: 17.4, y: 8.0, yaw_deg: 90}
