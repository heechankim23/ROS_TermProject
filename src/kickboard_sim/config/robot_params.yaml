# 노드별 기본 파라미터. 시나리오 YAML 의 robot.* 값이 launch 에서 덮어쓴다.
queue_manager:
  ros__parameters:
    w_r: 10.0          # 2026-11-15 s5 가중치 실험으로 10/1/5 유지 확정 (B, README 10장)
    w_t: 1.0
    w_d: 5.0
    d_max: 12.8        # 방 대각선 (10 x 8 m)
    auto_cancel: true
    tilt_threshold_deg: 45.0
    battery_threshold_pct: 20.0

mission_manager:
  ros__parameters:
    capacity: 2        # 적재 레인 2개 (SCOOTOVER v19)
    return_battery_pct: 20.0
    charge_target_pct: 80.0
    start_docked: true
    admin_alerts: true
    drop_clearance: 1.05       # 주차구역 하역 때 로봇이 서는 자리의 벽 여유 (제자리 회전 반경 0.98)
    scooter_battery_threshold_pct: 20.0   # 실은 킥보드 배터리가 이보다 낮으면 충전소, 아니면 주차구역에 하역
    opportunistic_drop_dist: 2.0  # 하역 자리가 이 거리(m) 안이면 다음 대상 전에 들러서 내림. 0 = 끔 (예전 동작)

battery_manager:
  ros__parameters:
    initial_pct: 100.0
    k1_pct_per_m: 1.0
    k2_pct_per_s: 0.02
    charge_rate_pct_per_s: 2.0
    return_battery_pct: 20.0

collector:
  ros__parameters:
    approach_standoff: 1.8     # 로봇 중심 -> 킥보드 GPS 점 (로봇 1.94 x 1.05 m, 램프 포함)
    verify_timeout_sec: 10.0
    align_distance: 1.35       # 로봇 중심 -> 킥보드 중심. 로봇팔이 발판에 닿는 거리 (자리는 nav_bridge 가 고름)
    align_yaw_tol_deg: 3.0     # reverse: 정렬 뒤 적재 자리에 직접 맞출 때 방향 허용 (align_pos_tol 0.05 m 와 함께)
    align_wait_sec: 5.0        # 정렬 이동 실패 시 먼저 이만큼 기다렸다 같은 자리로 다시 (지나가는 장애물). 0 = 바로 각도 변경
    align_retries: 2           # 그래도 실패하면 같은 반경(align_distance), 다른 각도 자리로 다시 시도. 0 = 안 함
    align_retry_offsets_deg: [90.0, -90.0, 180.0]   # 처음 실패한 자리 각도 기준 후보 순서 (nav_bridge 모드)
    align_spot_mode: dock      # dock = 대기점까지 간 뒤 직선 후진 도킹 (reverse 적재). scan = 자리 후보를 채점해 경로 주행. nav_bridge = 예전 방식
    dock_staging: [3.5, 3.0, 2.5, 2.0]   # 대기점 = 적재 자리에서 진행 방향으로 이만큼 앞 (앞의 것부터)
    align_blocked_wait_sec: 20.0   # scan: 후보가 없을 때 1초마다 다시 채점하며 기다리는 최대 시간 (자리에 선 사람이 비켜나길)
    load_time_sec: 3.0

nav_bridge:
  ros__parameters:
    scan_timeout_sec: 1.0     # 센서 수신 중단 감지: 실제 시간 기준 (시뮬 정지 중에도 정지)
    pose_timeout_sec: 1.0     # TF 타임스탬프 허용 나이: ROS 시간 기준
    sensor_wait_timeout_sec: 5.0  # 센서 복구 대기 한도: 실제 시간 기준
    max_retries: 2
    goal_timeout_sec: 120.0
    goal_clearance: 1.2        # 목표 지점에서 장애물(벽 + 라이다)까지 최소 거리: 회전 반경 1.11 + 격자(0.1 m) 오차
    inflation_radius: 1.2      # 경로가 장애물과 되도록 지키는 거리 (로봇을 덮는 원 + 격자 오차)
    obstacle_stop_dist: 0.15   # 안전장치: 라이다 바로 앞 이 거리 안에 뭔가 있으면 정지 (회피는 경로 계획)

scooter_fleet_sim:
  ros__parameters:
    gps_noise_sigma: 1.0
    tilt_threshold_deg: 45.0
    battery_threshold_pct: 20.0
    remove_on_load: true

dock_controller:
  ros__parameters:
    dock_mode: snap            # snap = 시뮬 실행용: 충전소 앞까지 주행 -> 도킹 자리로 들어가 시뮬레이터에서 맞춤 (항상 성공)
                               # precise = 설계대로 태그를 보며 P제어 정밀 진입 (발표에서 정밀 도킹을 보여 줄 때)
    snap_drive_sec: 15.0       # snap: 도킹 자리로 직접 들어가는 최대 시간, 그 뒤 남은 오차를 맞춤

sim_tag_detector:
  ros__parameters:
    hfov_deg: 62.2
    max_range: 3.0
    camera_offset_x: 0.9125    # 앞 카메라 = 차체 앞면 cam_front (Blender SCOOTOVER, model.sdf camera_link)

arm_loader:
  ros__parameters:
    time_scale: 1.0            # 2.0 이면 팔 동작이 2배 느려짐
    noise_pos: 0.02
