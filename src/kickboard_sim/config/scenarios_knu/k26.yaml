# K26. 계단 위 킥보드 (로봇 접근 불가)   [D 돌발상황]   발전시킨 기존 시나리오: s6_verify_fail
# scripts/build_knu_scenarios.py 가 만든 파일 — 좌표를 직접 고치지 말고 스크립트의 장소 정의를 고칠 것.
name: "K26. 계단 위 킥보드 (로봇 접근 불가)"
id: k26
category: "D 돌발상황"
map: knu_campus_flat
based_on: [s6_verify_fail]
situation: "누군가 킥보드를 계단 중간에 세워 두고 신고가 들어온다. 로봇은 계단을 오를 수 없다."
mission: "접근 가능한 자리를 찾지 못하면 일정 시간 안에 \"수거 불가\"로 판정하고 관리자에게 사진·위치와 함께 알린 뒤 다음 요청으로 간다."
expected:   # 킥보드별 예상 처리. order = 예상 처리 순서(우선순위), zone = 남은 칸을 따져 배정한 구역 (정책: 고장 > 배터리 부족 > 일반)
  - {id: 1, order: 1, dest: unreachable, zone: null, reasons: ["통행 방해 신고", "불법 주차"], hint: ""}
  - {id: 2, order: 2, dest: general, zone: P15, reasons: ["넘어짐", "불법 주차"], hint: "P15 106 인문한국진흥관 인근 (75 m)"}
pass_criteria:
  - "일반 주차구역 슬롯: #2 → 일반 구역 슬롯에 정상 방향으로 섬 (슬롯 중심 ±0.3 m, 방향 ±15°)"
  - "수거 불가 → 관리자 알림: #1 → 수거 불가 판정 + 관리자 알림 (5분 안)"
  - "충돌 0회, 계단·건물·운동장 진입 0회"
  - "모든 요청이 완료·취소·실패 중 하나로 닫힘"
robot: {initial_battery_pct: 100, capacity: 2}
scooters:          # id = AprilTag id. place: entrance|walkway|lawn|roadside|stairs|slot|zone_loose
  - {id: 1, x: 171.9, y: 45.02, yaw_deg: -35.4, battery_pct: 63, silent: true, place: stairs, where: "계단 중간"}
  - {id: 2, x: 28.11, y: 7.77, yaw_deg: -122.0, tilt_deg: 90, battery_pct: 70, place: walkway, where: "인문한국진흥관 앞 보행로"}
events:
  - {t: 10, id: 1, type: "report", reason: "obstruction", gps_error_m: 3.0, note: "계단을 막고 있어요"}
