  - {id: 2, x: -298.98, y: 12.39, yaw_deg: -179.0, battery_pct: 62, place: entrance, where: "209 자연과학대학 출입구 앞"}
  - {id: 3, x: -351.8, y: -78.0, yaw_deg: 77.7, battery_pct: 11, place: walkway, where: "제2과학관 앞 보행로"}
events:
