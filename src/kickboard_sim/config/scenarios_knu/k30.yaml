# K30. 세워 둔 킥보드가 다시 넘어짐   [D 돌발상황]   발전시킨 기존 시나리오: s16_refall_after_drop
# scripts/build_knu_scenarios.py 가 만든 파일 — 좌표를 직접 고치지 말고 스크립트의 장소 정의를 고칠 것.
name: "K30. 세워 둔 킥보드가 다시 넘어짐"
id: k30
category: "D 돌발상황"
map: knu_campus_flat
based_on: [s16_refall_after_drop]
situation: "로봇이 P15 구역에 세운 킥보드가 3분 뒤 바람에 다시 넘어진다(슬롯 밖에 세웠던 경우 재현)."
mission: "다시 생긴 넘어짐 요청을 받아 같은 구역의 슬롯에 바르게 다시 세운다. 같은 킥보드의 재요청 횟수를 기록한다."
expected:   # 킥보드별 예상 처리. order = 예상 처리 순서(우선순위), zone = 남은 칸을 따져 배정한 구역 (정책: 고장 > 배터리 부족 > 일반)
  - {id: 1, order: 1, dest: general, zone: P15, reasons: ["넘어짐", "불법 주차"], hint: "P15 106 인문한국진흥관 인근 (75 m)"}
pass_criteria:
  - "일반 주차구역 슬롯: #1 → 일반 구역 슬롯에 정상 방향으로 섬 (슬롯 중심 ±0.3 m, 방향 ±15°)"
  - "충돌 0회, 계단·건물·운동장 진입 0회"
  - "모든 요청이 완료·취소·실패 중 하나로 닫힘"
robot: {initial_battery_pct: 100, capacity: 4}
scooters:          # id = AprilTag id. place: entrance|walkway|lawn|roadside|stairs|slot|zone_loose
  - {id: 1, x: 35.59, y: 10.6, yaw_deg: -131.0, tilt_deg: 90, battery_pct: 71, place: walkway, where: "인문한국진흥관 앞 보행로"}
events:
  - {t: 600, id: 1, type: "fall", after_drop: 180}
