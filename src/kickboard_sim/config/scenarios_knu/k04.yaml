# K04. 넘어진 킥보드   [A 상태별 기본]   발전시킨 기존 시나리오: s1_single, s16_refall_after_drop
# scripts/build_knu_scenarios.py 가 만든 파일 — 좌표를 직접 고치지 말고 스크립트의 장소 정의를 고칠 것.
name: "K04. 넘어진 킥보드"
id: k04
category: "A 상태별 기본"
map: knu_campus_flat
based_on: [s1_single, s16_refall_after_drop]
situation: "바람 부는 날 인문대(104) 앞 보행로에 1대가 처음부터 넘어져 있고, 30초에 대운동장 옆 도로가의 킥보드가 넘어진다."
mission: "넘어진 킥보드를 들어 세워 적재하고, 일반 주차구역에 바르게 세운다. 넘어짐 요청은 다른 요청보다 먼저 처리한다."
expected:   # 킥보드별 예상 처리. order = 예상 처리 순서(우선순위), zone = 남은 칸을 따져 배정한 구역 (정책: 고장 > 배터리 부족 > 일반)
  - {id: 1, order: 1, dest: general, zone: P15, reasons: ["넘어짐", "불법 주차"], hint: "P15 106 인문한국진흥관 인근 (135 m)"}
  - {id: 2, order: 2, dest: general, zone: P24, reasons: ["불법 주차"], hint: "P24 401 공대2호관 인근 (118 m)"}
pass_criteria:
  - "일반 주차구역 슬롯: #1,2 → 일반 구역 슬롯에 정상 방향으로 섬 (슬롯 중심 ±0.3 m, 방향 ±15°)"
  - "충돌 0회, 계단·건물·운동장 진입 0회"
  - "모든 요청이 완료·취소·실패 중 하나로 닫힘"
robot: {initial_battery_pct: 100, capacity: 4}
scooters:          # id = AprilTag id. place: entrance|walkway|lawn|roadside|stairs|slot|zone_loose
  - {id: 1, x: 43.11, y: 72.93, yaw_deg: 158.8, tilt_deg: 90, battery_pct: 70, place: walkway, where: "인문대 앞 보행로"}
  - {id: 2, x: -262.25, y: -251.36, yaw_deg: -83.0, battery_pct: 55, place: roadside, where: "대운동장 옆 도로가"}
events:
  - {t: 30, id: 2, type: "fall"}
