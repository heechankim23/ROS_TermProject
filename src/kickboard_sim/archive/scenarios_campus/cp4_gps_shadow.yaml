name: "CP4. 건물 옆 GPS 음영"
map: campus
description: >
  건물 벽에 붙여 세운 킥보드 3대 (중앙도서관 동쪽, 제1과학관 남쪽, IT대학3호관 남쪽), GPS sigma 2.5 m.
  통과: GPS 점이 건물 안에 찍혀도 가장 가까운 빈 자리에서 회전 탐색 -> 태그 확인 -> 수거. 실패하면 verify_failed 비율 기록.
robot: {initial_battery_pct: 100, capacity: 4}
gps_noise_sigma: 2.5
scooters:
  - {id: 1, x: 16.9, y: 12.0, yaw_deg: 90}
  - {id: 2, x: -18.0, y: -7.6, yaw_deg: 0, tilt_deg: 90}
  - {id: 3, x: 2.0, y: -22.6, yaw_deg: 0}
