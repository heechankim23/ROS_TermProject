name: "CP5. 밤 누리관(기숙사) 앞 + 로봇 배터리 부족"
map: campus
description: >
  밤: 누리관·간호대학 앞에 배터리 부족 킥보드 4대 + 구역 밖 1대. 로봇은 26% 에서 시작해 작업 도중 20% 아래로 떨어진다.
  통과: 충전소로 복귀 -> 충전소행 하역 -> 80% 충전 -> 남은 요청 재개 (대기 시간은 이어짐)
robot: {initial_battery_pct: 26, capacity: 4}
scooters:
  - {id: 1, x: 20.5, y: 22.5, yaw_deg: 90, battery_pct: 7}
  - {id: 2, x: 22.5, y: 22.5, yaw_deg: 90, battery_pct: 11}
  - {id: 3, x: 17.0, y: 22.0, yaw_deg: 0, tilt_deg: 90, battery_pct: 5}
  - {id: 4, x: 26.0, y: 16.3, yaw_deg: -90, battery_pct: 9}
  - {id: 5, x: 15.0, y: 21.5, yaw_deg: 30, battery_pct: 70}
