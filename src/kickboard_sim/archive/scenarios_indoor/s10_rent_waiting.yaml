name: "10. 대기 중 대여됨 -> 자동 취소 -> 반납 후 재요청"
description: >
  2번이 대기열에 있는 동안 누가 빌려 가서 보고가 끊긴다 -> 8초 뒤 대기열에서 자동 취소(no heartbeat).
  60초에 구역 밖에 넘어진 채로 반납 -> 새 요청으로 다시 접수되어 수거.
  통과: 2번 CANCELLED(헛걸음 없음) -> 반납 뒤 2번 DONE
robot: {initial_battery_pct: 100, capacity: 4}
scooters:
  - {id: 1, x: -1.0, y: -2.0, yaw_deg: 0}            # 가까움 -> 먼저 처리
  - {id: 2, x: 3.5, y: 1.0, yaw_deg: 0}              # 멀리서 대기
events:
  - {t: 10, id: 2, type: rent}
  - {t: 60, id: 2, type: return, x: 2.0, y: -1.0, tilt_deg: 90, battery_pct: 55}
