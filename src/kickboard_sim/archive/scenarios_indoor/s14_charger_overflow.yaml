name: "14. 충전 자리 초과"
description: >
  배터리 부족 킥보드 5대 (충전소 충전 자리는 4곳, 적재함 4칸).
  통과: 4대 적재 -> 충전소 하역 4대 -> 5번째 수거 -> 가장 오래 맡긴 킥보드를 '충전 끝'으로 치우고(charged_out) 그 자리에 하역
robot: {initial_battery_pct: 100, capacity: 4}
scooters:
  - {id: 1, x: -1.0, y: -2.0, yaw_deg: 0, battery_pct: 10}
  - {id: 2, x: 0.5, y: 1.5, yaw_deg: 45, battery_pct: 8}
  - {id: 3, x: 2.0, y: -1.0, yaw_deg: 90, battery_pct: 12}
  - {id: 4, x: 3.0, y: 1.0, yaw_deg: 0, battery_pct: 5}
  - {id: 5, x: -2.0, y: -1.5, yaw_deg: 120, battery_pct: 9}
