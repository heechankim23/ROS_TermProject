name: "5. aging (기아 방지)"
description: >
  먼 곳의 배터리 부족(가중치 최저) 1건 + 충전소 근처에 넘어진 킥보드가 15초마다 계속 생김 -> 늘 더 높은 점수의 경쟁자가 있다.
  통과: 1번이 선택되는 순간 대기 중인 후보가 2건 이상이다 (queue_manager 로그 '다음 대상 1 (... 후보 N건)').
  즉 늦게 온 가까운 FALLEN 을 제치고 오래 기다린 1번이 선택된다 (aging 역전).
  참고: t_max(시작 로그)는 '이만큼 기다리면 어떤 새 요청에도 안 밀린다'는 우선순위 상한이지 서비스 시간 상한이 아니다.
  실제 대기 = t_max 이내에 역전 + 그때 하던 작업(수거 1건 또는 하역)이 끝날 때까지.
robot: {initial_battery_pct: 100, capacity: 4}
scooters:
  - {id: 1, x: 3.0, y: -2.6, yaw_deg: 0, battery_pct: 8, spawn_at: 0}   # 먼 곳, 구역 B 안 -> LOW_BATTERY
  # 가까운 킥보드는 서로 2 m 이상 띄우고, 도킹 진입로(y=0)와 구역 A 하역 자리(-2, 1.35) 근처는 비워 둔다.
  # (넘어진 킥보드는 0.6 x 1.07 m 를 차지한다. 붙여 놓으면 로봇팔이 닿는 빈 자리가 없어 align_failed 가 난다)
  - {id: 2, x: -2.6, y: -1.9, tilt_deg: 90, spawn_at: 0}
  - {id: 3, x: -0.6, y: 1.5, tilt_deg: 90, spawn_at: 0}
  - {id: 4, x: -0.6, y: -2.7, tilt_deg: 90, spawn_at: 15}
  - {id: 5, x: 1.0, y: -0.9, tilt_deg: 90, spawn_at: 30}
  - {id: 6, x: 2.2, y: 1.4, tilt_deg: 90, spawn_at: 45}
  - {id: 7, x: -2.6, y: -1.9, tilt_deg: 90, spawn_at: 60}
  - {id: 8, x: -0.6, y: 1.5, tilt_deg: 90, spawn_at: 75}
