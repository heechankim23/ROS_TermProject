name: "4. 배터리 부족"
description: >
  초기 배터리 23%. 첫 대상으로 가는 길(4 m 이상)에 20% 에 닿는다.
  통과: 주행 중 20% -> 현재 대상을 대기열에 되돌리고(REQUEUE) 복귀 -> 80% 충전 -> 2건 모두 수거
  (25% 로 두면 적재가 끝난 뒤에야 20% 가 되어 '주행 중 반납' 경로를 타지 않는다)
robot: {initial_battery_pct: 23, capacity: 4}
scooters:
  - {id: 1, x: 3.5, y: -1.0, yaw_deg: 0}
  - {id: 2, x: 2.5, y: 1.5, yaw_deg: 0}
