name: "13. 세워 둔 킥보드가 다시 넘어짐"
description: >
  수거해 주차구역에 세워 둔 1번이 100초에 (바람·행인에) 다시 넘어진다 -> 같은 ID 의 새 요청.
  통과: 1번 수거·하역 -> 다시 FALLEN 요청(merged=False) -> 두 번째 수거·하역 (다른 빈 자리에 세움)
robot: {initial_battery_pct: 100, capacity: 4}
gps_noise_sigma: 0.5     # 이 시나리오는 재요청 흐름을 본다. sigma 1 m 에서는 두 번째 요청의 GPS 가 2.8 m 어긋나 확인 실패로 끝난 적이 있다
scooters:
  - {id: 1, x: 1.5, y: -1.0, yaw_deg: 30, tilt_deg: 90, battery_pct: 80}
events:
  - {t: 100, id: 1, type: fall}
