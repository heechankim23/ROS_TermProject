name: "11. 가는 도중 대여됨 (헛걸음)"
description: >
  로봇이 1번으로 가는 중에 1번이 대여되어 사라진다. 처리 중(IN_PROGRESS) 항목은 비선점이라 취소되지 않는다.
  통과: 도착 -> 회전 탐색 10초 -> verify_failed + 관리자 알림 -> 다음 대상(2번) 정상 수거
  (개선 과제: 처리 중인 대상의 보고가 끊기면 즉시 중단하도록 mission_manager 를 확장)
robot: {initial_battery_pct: 100, capacity: 4}
scooters:
  - {id: 1, x: 3.5, y: -1.0, yaw_deg: 0}
  - {id: 2, x: -1.0, y: -2.0, yaw_deg: 0, spawn_at: 8}
events:
  - {t: 12, id: 1, type: rent}
