name: "15. 사유 우선순위"
description: >
  충전소에서 같은 거리(약 3 m)에 사유가 다른 3건이 동시에 접수된다. 대기 시간·거리가 같으므로 사유 가중치만 남는다.
  통과: 선택 순서 = FALLEN(1번) -> OUT_OF_ZONE(2번) -> LOW_BATTERY(3번).
  GPS 오차가 순서를 뒤집지 않게 sigma 를 0.2 m 로 줄였다 (sigma 1 m 면 거리 항 ±5 점 흔들림).
robot: {initial_battery_pct: 100, capacity: 4}
gps_noise_sigma: 0.2
scooters:
  - {id: 1, x: -0.6, y: -0.6, yaw_deg: 0, tilt_deg: 90}                # FALLEN        R=3
  - {id: 2, x: -1.2, y: -1.9, yaw_deg: 0}                              # OUT_OF_ZONE   R=2
  - {id: 3, x: -2.0, y: 2.6, yaw_deg: 0, battery_pct: 10}              # LOW_BATTERY   R=1 (구역 A 안)
