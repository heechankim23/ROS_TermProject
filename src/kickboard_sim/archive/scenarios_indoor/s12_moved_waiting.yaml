name: "12. 대기 중 누가 옮김 (위치 갱신)"
description: >
  2번이 대기 중일 때 3 m 넘게 옮겨진다(여전히 구역 밖). 펌웨어가 새 GPS 로 다시 요청 -> 같은 ID 병합, 위치만 갱신.
  통과: 2번 요청이 merged=True 로 한 번 더 접수되고, 로봇이 옛 자리가 아니라 새 자리로 가서 수거
robot: {initial_battery_pct: 100, capacity: 4}
scooters:
  - {id: 1, x: -1.0, y: -2.0, yaw_deg: 0}
  - {id: 2, x: 3.0, y: 1.0, yaw_deg: 0}
events:
  - {t: 8, id: 2, type: move, x: 0.5, y: 1.8, yaw_deg: 120}
