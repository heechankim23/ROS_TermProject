name: "ST3. 버스정류장 주변에 몰려 있는 킥보드"
map: street
description: >
  버스정류장 옆 남측 인도에 세워진 2대 + 넘어진 1대, 건너편 북측 인도에 세워진 2대. 전부 처음부터 놓여 있다.
  통과: 5대 수거 (적재함 4칸 -> 4대 싣고 하역 후 1대 더), 배터리 부족은 충전소로, 나머지는 주차구역으로 -> 충전
robot: {initial_battery_pct: 70, capacity: 4}
scooters:
  - {id: 1, x: 12.7, y: -1.4, yaw_deg: 0, battery_pct: 60}
  - {id: 2, x: 13.6, y: -1.4, yaw_deg: 0, battery_pct: 9}
  - {id: 3, x: 5.0, y: -1.4, yaw_deg: 0, tilt_deg: 90, battery_pct: 50}
  - {id: 4, x: 6.0, y: 5.4, yaw_deg: 0, battery_pct: 72}
  - {id: 5, x: 6.9, y: 5.4, yaw_deg: 0, battery_pct: 11}
