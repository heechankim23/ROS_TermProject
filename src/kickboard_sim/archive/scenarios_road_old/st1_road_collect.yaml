name: "ST1. 차도 주행 수거 (눕은 킥보드 + 나란히 세워진 킥보드)"
map: street
description: >
  킥보드 5대가 처음부터 인도에 놓여 있다: 간선도로 옆에 넘어진 1대, 샛길 옆에 나란히 세워진 3대(배터리 부족),
  연결로 옆에 넘어진 1대. 로봇은 차도·주차장으로만 다니고 인도에는 올라가지 않는다 (차도 가장자리에 서서 로봇팔로 집는다).
  통과: 주차장 충전소 출발 -> 진입로 -> 간선도로 -> 샛길·연결로에서 수거 -> 배터리 정상 2대는 인도 주차구역에 세움
        -> 충전소 복귀·도킹 -> 배터리 부족 3대를 충전 자리에 하역 -> 로봇 80% 까지 충전
robot: {initial_battery_pct: 55, capacity: 4}
scooters:
  - {id: 1, x: -8.0, y: 5.4, yaw_deg: 180, tilt_deg: 90, battery_pct: 70}    # 간선도로 북쪽 인도, 넘어짐
  - {id: 2, x: -3.4, y: 7.2, yaw_deg: 90, battery_pct: 8}                    # 샛길 서쪽 인도, 나란히 세워진 3대
  - {id: 3, x: -3.4, y: 8.1, yaw_deg: 90, battery_pct: 10}
  - {id: 4, x: -3.4, y: 9.0, yaw_deg: 90, battery_pct: 12}
  - {id: 5, x: 17.4, y: 9.0, yaw_deg: 90, tilt_deg: 90, battery_pct: 65}     # 연결로 동쪽 인도, 넘어짐
