name: "ST2. 샛길 입구가 막힘 (공사 펜스)"
map: street
description: >
  샛길의 간선도로 쪽 입구를 공사 펜스가 막고 있다. 샛길 안쪽에 넘어진 1대, 뒷길 옆에 배터리 부족 1대.
  통과: 연결로 -> 뒷길로 돌아 샛길 북쪽에서 들어가 수거 (순환로가 있어야 가능) -> 주차구역·충전소 하역 -> 충전
robot: {initial_battery_pct: 60, capacity: 4}
# 주의: 킥보드를 펜스 바로 뒤(3 m 이내)에 두면 Gazebo 에서 로봇이 펜스 앞에서 목표를 계속 바꾸며 제자리에서 돈다 (알려진 한계)
gps_noise_sigma: 0.5
scooters:
  - {id: 1, x: -3.4, y: 10.2, yaw_deg: -90, tilt_deg: 90, battery_pct: 75}    # 샛길 북쪽 끝 (펜스에서 4 m 이상)
  - {id: 2, x: 7.0, y: 10.6, yaw_deg: 0, battery_pct: 9}
events:
  - {t: 0, type: obstacle, name: fence, x: -0.5, y: 5.6, size: [5.0, 0.8, 1.2]}
